<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="FilteredResearch FR book mark">
  <rect width="1024" height="1024" fill="#fbfcfb"/>

  <!-- Back cover, offset down and right so the book has depth. -->
  <rect x="176" y="206" width="716" height="700" rx="76" fill="#477c73" stroke="#111311" stroke-width="26"/>
  <!-- Page block peeking out between the covers. -->
  <rect x="150" y="176" width="716" height="700" rx="76" fill="#e6efed" stroke="#111311" stroke-width="26"/>
  <!-- Front cover. -->
  <rect x="124" y="146" width="716" height="700" rx="76" fill="#fbfcfb" stroke="#111311" stroke-width="26"/>

  <!-- Spine fold and its two binding bands. -->
  <path d="M232 172V820" fill="none" stroke="#477c73" stroke-width="20"/>
  <path d="M150 300H232M150 692H232" fill="none" stroke="#111311" stroke-width="18"/>

  <!-- Opal panel carrying the FR monogram. -->
  <rect x="292" y="232" width="500" height="528" rx="44" fill="#a6d2ca"/>

  <path d="M372 656V352H528M372 492H500" fill="none" stroke="#111311" stroke-linecap="square" stroke-linejoin="miter" stroke-width="52"/>
  <path d="M578 656V352H668Q744 352 744 428Q744 504 668 504H578M664 504L750 656" fill="none" stroke="#111311" stroke-linecap="square" stroke-linejoin="miter" stroke-width="52"/>
</svg>
