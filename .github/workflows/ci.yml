name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm run package
      - name: Archive unpacked extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cd dist/filteredresearch-extension && zip -r ../../FilteredResearch-main.zip .
      - name: Upload main-branch package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: FilteredResearch-main
          path: FilteredResearch-main.zip
          if-no-files-found: error
